services:
  mysql:
    image: mysql:8
    container_name: ecommerce_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommerce
    ports:
      - "3306:3306"
    volumes:
      - ../db/init-01.sql:/docker-entrypoint-initdb.d/init-01.sql
      - ../db/init-data-02.sql:/docker-entrypoint-initdb.d/init-data-02.sql

  minio:
    image: minio/minio
    container_name: ecommerce_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  minio_data: